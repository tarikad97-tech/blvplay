         2. أيقونة الموقع والخطوط
         ========================================= -->

         ========================================= -->

    <meta property="og:locale" content="ar_AR" />

    <meta
      property="og:title"
      content="BLV Play — تحديات وألعاب كرة القدم"

      يفضّل أن تكون بقياس 1200 × 630 بكسل.
    -->

      property="og:image"
      content="https://blvplay.site/og-image.png"
    />

      property="og:image:alt"
      content="BLV Play — تحديات كرة القدم التفاعلية"
