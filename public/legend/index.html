<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>طريق الأسطورة — فلتر</title>

  <!-- خط تجوال العربي -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <!-- فيديو الكاميرا (مخفي، يُرسم على الـ canvas) -->
    <video id="v" playsinline muted></video>

    <!-- لوحة الرسم الرئيسية -->
    <canvas id="c" width="1080" height="1920"></canvas>

    <!-- أزرار لمس شفافة تُولَّد من الكود حسب الشاشة -->
    <div id="zones"></div>

    <!-- مؤشر التسجيل -->
    <div id="recdot" class="hid"><i></i>REC <span id="rt">0:00</span></div>

    <!-- لوحة البداية: الاسم والأفاتار والمركز وزر التشغيل -->
    <div class="ov" id="dock">
      <input id="nm" maxlength="22" value="موهبة مغربية" aria-label="اسم اللاعب">
      <div class="avs" id="avs"></div>
      <div class="chips" id="ps"></div>
      <button class="btn" id="go">شغّل الكاميرا والميكروفون</button>
      <button class="btn alt" id="lbb" type="button">الترتيب</button>
      <p class="hint" id="ht">اختر من أكثر من 80 نادياً في دوريات متعددة، ثم ابنِ مسيرتك بقرارات فنية ونفسية من 17 إلى 38 سنة. الفيديو يُسجَّل بصوتك مع المؤثرات. يلزم فتح الملف عبر https أو localhost.</p>
    </div>

    <!-- شاشة الترتيب -->
    <div id="lb" class="hid"></div>

    <!-- شاشة النتيجة: معاينة الفيديو وتحميله -->
    <div id="res">
      <video id="rv" controls playsinline></video>
      <a class="btn" id="dl" download>تحميل الفيديو</a>
      <button class="btn" type="button" onclick="showLB()">الترتيب</button>
      <button class="btn alt" onclick="location.reload()">مسيرة جديدة</button>
    </div>
  </div>

  <!-- ترتيب التحميل مهم: كل ملف يعتمد على ما قبله -->
  <script src="data.js"></script>    <!-- بيانات الأندية والدول -->
  <script src="engine.js"></script>  <!-- محرك المسيرة -->
  <script src="audio.js"></script>   <!-- المؤثرات الصوتية -->
  <script src="render.js"></script>  <!-- أدوات الرسم: النص، الشعارات، الأيقونات، الأفاتار -->
  <script src="screens.js"></script> <!-- شاشات اللعبة والعدّ التنازلي والإطار الكامل -->
  <script src="main.js"></script>    <!-- التدفق، الكاميرا، التسجيل، الترتيب -->
</body>
</html>
